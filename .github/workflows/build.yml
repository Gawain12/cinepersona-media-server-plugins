name: Build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore Emby marketplace plugin
        run: >-
          dotnet restore Emby.Plugin.CinePersona.csproj
          -p:CinePersonaFlavor=Marketplace
          -p:BaseIntermediateOutputPath=obj/marketplace/

      - name: Build Emby marketplace plugin
        run: >-
          dotnet build Emby.Plugin.CinePersona.csproj -c Release --no-restore
          -p:CinePersonaFlavor=Marketplace
          -p:BaseIntermediateOutputPath=obj/marketplace/
          -p:OutputPath=bin/Release/netstandard2.0/marketplace/

      - name: Build Emby geek plugin
        run: >-
          dotnet build Emby.Plugin.CinePersona.csproj -c Release
          -p:CinePersonaFlavor=Geek
          -p:BaseIntermediateOutputPath=obj/geek/
          -p:OutputPath=bin/Release/netstandard2.0/geek/

      - name: Restore Jellyfin plugin
        run: dotnet restore jellyfin/Jellyfin.Plugin.CinePersona/Jellyfin.Plugin.CinePersona.csproj

      - name: Build Jellyfin plugin
        run: dotnet build jellyfin/Jellyfin.Plugin.CinePersona/Jellyfin.Plugin.CinePersona.csproj -c Release --no-restore

      - name: Upload plugin binaries
        uses: actions/upload-artifact@v4
        with:
          name: cinepersona-plugins-${{ github.sha }}
          if-no-files-found: error
          path: |
            **/bin/Release/**/Emby.Plugin.CinePersona*.dll
            **/bin/Release/**/Jellyfin.Plugin.CinePersona.dll

      - name: Test Plex relay
        working-directory: plex/CinePersona.PlexRelay
        run: go test ./...

      - name: Build Plex relay
        working-directory: plex/CinePersona.PlexRelay
        run: go build ./...
