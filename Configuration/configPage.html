    <style type="text/css">
        .cinepersonaConfigurationPage .content-primary {
            max-width: 680px;
        }

        .cinepersonaHero {
            display: grid !important;
            grid-template-columns: 56px minmax(0, 1fr) !important;
            gap: 16px !important;
            align-items: center !important;
            margin: 8px 0 24px !important;
            padding: 18px 20px !important;
            border: 1px solid rgba(67, 175, 255, 0.28) !important;
            border-radius: 14px !important;
            background: radial-gradient(circle at 12% 10%, rgba(0, 174, 255, 0.22), transparent 42%), linear-gradient(135deg, #0b1220 0%, #101d35 55%, #0a0e18 100%) !important;
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.18) !important;
        }

        .cinepersonaHeroMark {
            display: block !important;
            width: 56px !important;
            height: 56px !important;
            border-radius: 14px !important;
            box-shadow: 0 0 28px rgba(23, 174, 255, 0.26) !important;
        }

        .cinepersonaHeroEyebrow {
            margin: 0 0 7px;
            color: #72c9ff;
            font-size: 0.72em;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .cinepersonaHeroTitle {
            margin: 0;
            color: #f4f8ff;
            font-size: clamp(1.18em, 3vw, 1.45em);
            line-height: 1.22;
        }

        .cinepersonaHeroCopy {
            margin: 6px 0 0;
            color: rgba(231, 241, 255, 0.78);
            line-height: 1.45;
        }

        .cinepersonaSectionTitle {
            margin: 0 0 8px;
        }

        .cinepersonaSectionCopy {
            margin: 0 0 22px;
        }

        .cinepersonaHint {
            color: #2380b7;
        }

        .cinepersonaSaveStatus {
            min-height: 1.5em;
            margin-top: 12px;
            line-height: 1.45;
        }

        .cinepersonaSaveStatus[data-state="saving"] { color: rgba(231, 241, 255, 0.7); }
        .cinepersonaSaveStatus[data-state="success"] { color: #238653; }
        .cinepersonaSaveStatus[data-state="error"] { color: #b42318; }

        .cinepersonaProfiles {
            display: grid;
            gap: 10px;
            margin: 12px 0 20px;
        }

        .cinepersonaProfileRow {
            display: grid;
            grid-template-columns: minmax(150px, 1fr) minmax(180px, 1.35fr) auto auto;
            gap: 8px;
            align-items: center;
            padding: 10px;
            border: 1px solid rgba(120, 140, 165, .28);
            border-radius: 10px;
            background: rgba(127, 150, 180, .08);
        }

        .cinepersonaProfileKey {
            min-width: 0;
        }

        .cinepersonaProfileEmpty {
            padding: 12px;
            border: 1px dashed rgba(120, 140, 165, .42);
            border-radius: 10px;
            color: rgba(96, 112, 132, .9);
        }

        .cinepersonaRemoveProfile {
            min-width: 0 !important;
            margin: 0 !important;
            padding: 8px 10px !important;
        }

        @media (max-width: 700px) {
            .cinepersonaProfileRow {
                grid-template-columns: 1fr 1fr;
            }

            .cinepersonaProfileRow .cinepersonaProfileEnabled {
                grid-column: 1;
            }

            .cinepersonaProfileRow .cinepersonaRemoveProfile {
                grid-column: 2;
                justify-self: end;
            }
        }

        @media (max-width: 560px) {
            .cinepersonaHero {
                grid-template-columns: 48px minmax(0, 1fr) !important;
                gap: 12px !important;
                padding: 16px !important;
            }

            .cinepersonaHeroMark {
                width: 48px !important;
                height: 48px !important;
                border-radius: 12px !important;
            }
        }
    </style>
    <div data-role="page" class="page type-interior pluginConfigurationPage cinepersonaConfigurationPage" data-require="emby-input,emby-button" data-controller="__plugin/CinePersonaConfigurationPageJS">
        <div class="content-primary">
            <section class="cinepersonaHero" aria-labelledby="cinepersonaHeroTitle">
                <a href="https://cinepersona.com" target="_blank" rel="noopener noreferrer">
                    <img class="cinepersonaHeroMark" src="https://cinepersona.com/cinepersona-icon.png" alt="CinePersona" width="56" height="56" style="width:56px;height:56px" />
                </a>
                <div>
                    <p class="cinepersonaHeroEyebrow">Media watch sync</p>
                    <h2 id="cinepersonaHeroTitle" class="cinepersonaHeroTitle">把看过的电影，留在 CinePersona</h2>
                    <p class="cinepersonaHeroCopy">播放达到 80%，看过状态和星级评分自动同步。</p>
                </div>
            </section>

            <form id="cinepersonaConfigurationForm" class="cinepersonaConfigurationForm">
                <h2 class="cinepersonaSectionTitle">服务器设置</h2>
                <p class="cinepersonaSectionCopy">管理员在这里为服务器用户配置 CinePersona Key。配置完成后，普通用户直接使用 Emby 即可同步。</p>

                <div class="inputContainer">
                    <label class="inputLabel" for="txtServerUrl">CinePersona 地址</label>
                    <input is="emby-input" type="url" id="txtServerUrl" name="txtServerUrl" value="https://cinepersona.com" required />
                    <div class="fieldDescription">正式环境：<span class="cinepersonaHint">https://cinepersona.com</span>　测试环境：https://test.gawyn.de</div>
                </div>

                <label class="checkboxContainer">
                    <input is="emby-checkbox" type="checkbox" id="chkReverseSync" />
                    <span>启用 CinePersona → Emby 定期同步（每 6 小时）</span>
                </label>

                <h2 class="cinepersonaSectionTitle">用户连接</h2>
                <p class="cinepersonaSectionCopy">每个用户使用自己的 CinePersona 账号。API Key 只保存在插件配置中，不会出现在电影页面。</p>
                <div id="cinepersonaProfiles" class="cinepersonaProfiles"></div>
                <button is="emby-button" type="button" class="button-submit" id="btnAddProfile">添加用户</button>

                <button is="emby-button" type="submit" class="raised button-submit block" id="btnSave">保存设置</button>
                <div id="cinepersonaSaveStatus" class="cinepersonaSaveStatus" role="status" aria-live="polite"></div>
            </form>
        </div>

    </div>
