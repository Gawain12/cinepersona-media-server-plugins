<!DOCTYPE html>
<html>
<head>
    <title>CinePersona</title>
</head>
<body>
    <div data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <div class="content-primary">
            <form class="cinepersonaConfigurationForm">
                <h2>CinePersona 服务器设置</h2>
                <p>观影完成度达到 80% 后，按当前登录用户同步电影记录、看过状态和评分。</p>
                <p>每位用户请在电影页面的 CinePersona 评分按钮中填写自己的 API Key。</p>

                <div class="inputContainer">
                    <label class="inputLabel" for="txtServerUrl">CinePersona 地址:</label>
                    <input is="emby-input" type="url" id="txtServerUrl" name="txtServerUrl" value="https://cinepersona.com" required />
                    <div class="fieldDescription">测试环境可填写 https://test.gawyn.de</div>
                </div>

                <label class="checkboxContainer">
                    <input is="emby-checkbox" type="checkbox" id="chkReverseSync" />
                    <span>启用 CinePersona → Jellyfin 定期同步（每 6 小时）</span>
                </label>

                <button is="emby-button" type="submit" class="raised button-submit block">保存</button>
            </form>
        </div>

        <script type="text/javascript">
            var CinePersonaConfig = {
                pluginUniqueId: "f62e8471-469b-43d8-b57f-f4a4d7d10002"
            };

            $('.cinepersonaConfigurationForm').on('pageshow', function () {
                var form = this;
                ApiClient.getPluginConfiguration(CinePersonaConfig.pluginUniqueId).then(function (config) {
                    $('#txtServerUrl', form).val(config.ServerUrl || 'https://cinepersona.com');
                    $('#chkReverseSync', form).prop('checked', config.ReverseSyncEnabled !== false);
                });
            });

            $('.cinepersonaConfigurationForm').on('submit', function () {
                var form = this;
                ApiClient.getPluginConfiguration(CinePersonaConfig.pluginUniqueId).then(function (config) {
                    config.ServerUrl = $('#txtServerUrl', form).val();
                    config.ReverseSyncEnabled = $('#chkReverseSync', form).prop('checked');
                    ApiClient.updatePluginConfiguration(CinePersonaConfig.pluginUniqueId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });
                return false;
            });
        </script>
    </div>
</body>
</html>
